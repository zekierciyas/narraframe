name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I make a video I often need to …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Mock-ups or examples are welcome.
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with some guidance"
        - "No"
